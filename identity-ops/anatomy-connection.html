.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}

.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}

.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}

.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}

.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}

.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}

.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}

* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 1px;
  font-family:
    Segoe UI,
    sans-serif;
  background: var(--anatomy-page);
  color: var(--anatomy-strong);
}
.iso-figure {
  margin: 0;
}
.iso-plate {
  padding: 20px;
  border: 1px solid var(--anatomy-lo);
  box-shadow: none;
}
.iso-plate header,
.iso-plate footer {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: var(--anatomy-text);
}
.systems {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 180px minmax(0, 1fr);
  align-items: start;
  margin: 26px 0 20px;
}
.system {
  min-width: 0;
  position: relative;
}
.system h3 {
  font-size: 22px;
  margin: 0;
  text-align: center;
}
.system > p {
  text-align: center;
  font-size: 12px;
  color: var(--anatomy-text);
  margin: 8px 0 12px;
}
.system svg {
  width: 100%;
  height: auto;
  display: block;
}
.screen-ui text {
  fill: var(--anatomy-strong);
  font-family:
    Segoe UI,
    sans-serif;
  letter-spacing: 0;
}
.screen-ground {
  fill: var(--anatomy-card);
}
.screen-rule {
  fill: var(--anatomy-lo);
}
.screen-panel {
  fill: var(--anatomy-face);
  stroke: var(--anatomy-mid);
  stroke-width: 0.3;
}
.screen-muted {
  fill: var(--anatomy-text);
}
.connection {
  text-align: center;
  align-self: center;
}
.connection p {
  font-size: 14px;
  line-height: 1.5;
  min-height: 42px;
  margin: 0 0 12px;
}
.connection small {
  display: block;
  font-size: 11px;
  line-height: 1.5;
  margin-top: 12px;
  color: var(--anatomy-text);
}
.rail {
  height: 2px;
  background: var(--anatomy-lo);
  position: relative;
  margin: 0 10px;
}
.rail::after {
  content: '';
  position: absolute;
  right: 0;
  top: -4px;
  border-left: 8px solid var(--anatomy-hi);
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
}
[data-phase='2'] .rail::after,
[data-phase='5'] .rail::after {
  right: auto;
  left: 0;
  transform: rotate(180deg);
}
[data-phase='0'] .rail::after,
[data-phase='3'] .rail::after {
  display: none;
}
.endpoint {
  position: absolute;
  left: 0;
  top: -3px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--anatomy-hi);
}
.endpoint:last-child {
  right: 0;
  left: auto;
}
.packet {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 3px;
  background: var(--anatomy-strong);
  top: -5px;
  left: calc(var(--travel, 0) * 100%);
  transform: translateX(-50%);
  opacity: var(--packet-opacity, 0);
}
[data-phase='2'] .packet,
[data-phase='5'] .packet {
  left: calc((1 - var(--travel, 0)) * 100%);
}
.ticket {
  position: absolute;
  z-index: 1;
  top: 65px;
  left: 10%;
  width: 80%;
  padding: 10px;
  font-size: 13px;
  text-align: center;
  background: var(--anatomy-card);
  border: 1px solid var(--anatomy-hi);
  border-radius: 5px;
  transform: translateY(calc(var(--ticket-progress, 0) * 80px));
  opacity: var(--ticket-opacity, 1);
}
.ticket span {
  display: block;
}
.admin {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  border: 1px solid var(--anatomy-lo);
  padding: 12px;
  margin: 8px auto 0;
  border-radius: 5px;
  transition:
    border-color 0.5s,
    background 0.5s;
}
.admin > span {
  font-size: 30px;
}
.admin strong {
  font-size: 13px;
}
.admin small {
  display: block;
  font-size: 12px;
  color: var(--anatomy-text);
  margin-top: 4px;
}
.admin[data-active='true'] {
  border-color: var(--anatomy-strong);
  background: var(--anatomy-face);
}
.controls {
  display: flex;
  gap: 10px;
  margin: 16px 0;
}
button {
  font: inherit;
  color: var(--anatomy-strong);
  background: var(--anatomy-card);
  border: 1px solid var(--anatomy-mid);
  border-radius: 5px;
  min-height: 44px;
  padding: 10px 14px;
  cursor: pointer;
}
button[hidden] {
  display: none;
}
button:focus-visible,
[data-flow]:focus-visible {
  outline: 2px solid var(--anatomy-strong);
  outline-offset: 3px;
}
figcaption > p {
  font-size: 16px;
  line-height: 1.6;
  min-height: 52px;
}
nav {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}
nav button {
  text-align: left;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 10px;
}
nav span {
  font-size: 12px;
  color: var(--anatomy-text);
}
nav button[aria-pressed='true'] {
  border-color: var(--anatomy-strong);
  background: var(--anatomy-face);
}
.boundary {
  color: var(--anatomy-text);
  font-size: 12px;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
.iso:not([data-theme='light']) {
  --anatomy-page: #0b1824;
  --anatomy-card: #101f2c;
  --anatomy-paper: #101f2c;
  --anatomy-face: #253644;
  --anatomy-top: #263745;
  --anatomy-shade-0: #132331;
  --anatomy-shade-1: #182936;
  --anatomy-shade-2: #1c2e3d;
  --anatomy-shade-3: #223443;
  --anatomy-hi: #bacbd8;
  --anatomy-mid: #7d94a6;
  --anatomy-lo: #455d70;
  --anatomy-faint: #30485c;
  --anatomy-text: #a9bccb;
  --anatomy-strong: #e6eff5;
  --anatomy-muted: #8b9fae;
}
@media (max-width: 600px) {
  .iso-plate {
    padding: 16px 10px;
  }
  .systems {
    grid-template-columns: 1fr;
    margin: 20px 0;
  }
  .system svg {
    max-width: 360px;
    margin: auto;
  }
  .system h3 {
    font-size: 20px;
  }
  .connection {
    position: relative;
    padding: 16px 36px;
    margin: 8px 0;
  }
  .connection p {
    min-height: 0;
    margin: 0;
  }
  .connection small {
    margin: 5px 0 0;
  }
  .rail {
    position: absolute;
    left: 12px;
    top: 0;
    height: 100%;
    width: 2px;
    margin: 0;
  }
  .endpoint {
    left: -3px;
    top: 0;
  }
  .endpoint:last-child {
    top: auto;
    bottom: 0;
    right: auto;
    left: -3px;
  }
  .rail::after {
    right: auto;
    left: -4px;
    top: auto;
    bottom: 0;
    transform: rotate(90deg);
  }
  [data-phase='2'] .rail::after,
  [data-phase='5'] .rail::after {
    left: -4px;
    top: 0;
    bottom: auto;
    transform: rotate(-90deg);
  }
  .packet {
    left: -5px;
    top: calc(var(--travel, 0) * 100%);
    transform: translateY(-50%);
  }
  [data-phase='2'] .packet,
  [data-phase='5'] .packet {
    left: -5px;
    top: calc((1 - var(--travel, 0)) * 100%);
  }
  .iso-plate footer {
    flex-direction: column;
    font-size: 11px;
    gap: 5px;
  }
  nav {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  figcaption > p {
    font-size: 14px;
    min-height: 70px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .admin {
    transition: none;
  }
  .packet,
  .ticket {
    display: none;
  }

.1L517.7 442L517.7 440.7L517.8 440.8Z"/><path class="iso-top" d="M523.2 439.8L523.5 439.8L523.7 439.9L523.9 439.9L523.9 440L524 440.1L523.9 440.2L522.9 441.2L522.8 441.2L522.6 441.3L522.4 441.3L522.1 441.4L521.8 441.4L521.6 441.4L518.5 441.1L518.2 441L518 441L517.9 440.9L517.8 440.8L517.7 440.7L517.8 440.6L518.8 439.7L518.9 439.6L519.1 439.5L519.3 439.5L519.6 439.5L519.9 439.5L520.1 439.5Z"/><path class="iso-line iso-crease" data-tone="faint" d="M524 440.1L523.9 440.2L522.9 441.2L522.8 441.2L522.6 441.3L522.4 441.3L522.1 441.4L521.8 441.4L521.6 441.4L518.5 441.1L518.2 441L518 441L517.9 440.9L517.8 440.8L517.7 440.7"/><path class="iso-line iso-bevel" data-tone="faint" d="M524 440.1L522.6 440.1L521.7 441L521.7 441L521.7 441L521.8 441L521.8 441L521.9 441L521.9 441L519 440.7L519 440.7L519 440.7L519.1 440.7L519.1 440.7L517.7 440.7"/><path class="iso-line iso-edge" data-tone="lo" d="M517.7 440.7L517.8 440.6L518.8 439.7L518.9 439.6L519.1 439.5L519.3 439.5L519.6 439.5L519.9 439.5L520.1 439.5L523.2 439.8L523.5 439.8L523.7 439.9L523.9 439.9L523.9 440L524 440.1M524 441.4L523.9 441.5L522.9 442.4L522.8 442.5L522.6 442.6L522.4 442.6L522.1 442.7L521.8 442.7L521.6 442.6L518.5 442.3L518.2 442.3L518 442.2L517.9 442.2L517.8 442.1L517.7 442M524 440.1L524 441.4M517.7 440.7L517.7 442"/></g></g></g></svg><div class="admin" data-admin><span aria-hidden="true">♙</span><div><strong>You, the administrator</strong><small>Approve → Assign in Entra portal</small></div></div></section></div><footer><span>Illustration only · No live operations</span><span>Read → Change → Read again</span></footer></div><div class="controls"><button type="button" data-play>Play the flow</button><button type="button" data-replay>Replay</button></div><figcaption><p data-caption>A simulated user cannot access ExampleApp. The ticket enters Identity Ops Lab.</p><nav aria-label="Animation steps"><button type="button" data-step="0" aria-pressed="true"><span>1</span>Ticket arrives</button><button type="button" data-step="1" aria-pressed="false"><span>2</span>Read Entra</button><button type="button" data-step="2" aria-pressed="false"><span>3</span>Assignment missing</button><button type="button" data-step="3" aria-pressed="false"><span>4</span>You make the change</button><button type="button" data-step="4" aria-pressed="false"><span>5</span>Read Entra again</button><button type="button" data-step="5" aria-pressed="false"><span>6</span>Change visible in the lab</button></nav><p class="boundary">An assignment appearing in the lab is not proof of a successful sign-in. Test the app separately before closing the ticket.</p></figcaption><p role="status" aria-live="polite" data-status class="sr-only"></p></figure><script type="module">export const STEP_TIME = 3600;
export const FLOW_STEPS = [
  ['Ticket arrives', 'A simulated user cannot access ExampleApp. The ticket enters Identity Ops Lab.'],
  ['Read Entra', 'Identity Ops asks Microsoft Graph for the user’s app assignment. This is read-only.'],
  ['Assignment missing', 'Entra returns the current state: the user is not assigned to ExampleApp.'],
  ['You make the change', 'After approval, you assign the user in the Entra portal. The lab does not write to Entra.'],
  ['Read Entra again', 'Identity Ops requests the latest assignment through Graph. Entra does not push this update.'],
  [
    'Change visible in the lab',
    'The new assignment appears in Identity Ops. Test real app access before closing the ticket.',
  ],
];
export function flowAt(time) {
  const elapsed = Math.min(STEP_TIME * FLOW_STEPS.length, Math.max(0, Number.isFinite(time) ? time : 0));
  const step = Math.min(FLOW_STEPS.length - 1, Math.floor(elapsed / STEP_TIME));
  const progress = Math.min(1, (elapsed - step * STEP_TIME) / STEP_TIME);
  const eased = progress * progress * (3 - 2 * progress);
  // The marker reaches its endpoint before the received state appears.
  const transferProgress = Math.min(1, progress / 0.65);
  return {
    step,
    progress,
    eased,
    transferProgress,
    travel: transferProgress * transferProgress * (3 - 2 * transferProgress),
    elapsed,
    complete: elapsed === STEP_TIME * FLOW_STEPS.length,
    tenantAssigned: elapsed >= STEP_TIME * 3.75,
    labChecked: elapsed >= STEP_TIME * 2.65,
    labAssigned: elapsed >= STEP_TIME * 5.65,
  };
}

const root = document.querySelector('[data-flow]');
const play = document.querySelector('[data-play]');
const status = document.querySelector('[data-status]');
const buttons = [...document.querySelectorAll('[data-step]')];
const reduced = matchMedia('(prefers-reduced-motion: reduce)');
let elapsed = 0,
  frame = 0,
  last = 0,
  playing = false,
  visible = false,
  touring = true,
  timer,
  previousStep = -1;
const total = STEP_TIME * FLOW_STEPS.length;
function render() {
  const state = flowAt(elapsed);
  root.dataset.phase = state.step;
  root.style.setProperty('--travel', state.travel);
  const moving = [1, 2, 4, 5].includes(state.step) && !reduced.matches;
  root.style.setProperty('--packet-opacity', moving ? Math.sin(state.transferProgress * Math.PI) : 0);
  root.style.setProperty('--ticket-progress', state.step === 0 ? state.eased : 1);
  root.style.setProperty('--ticket-opacity', state.step === 0 ? 1 - Math.max(0, (state.progress - 0.65) / 0.35) : 0);
  root.querySelector('[data-lab-assignment]').textContent = state.labAssigned
    ? 'App assigned'
    : state.labChecked
      ? 'Not assigned'
      : 'Not checked';
  root.querySelector('[data-tenant-assignment]').textContent = state.tenantAssigned ? 'App assigned' : 'Not assigned';
  root.querySelector('[data-lab-ticket]').textContent =
    state.step === 0 && state.progress < 0.65 ? 'Receiving ticket' : 'Ticket open';
  document.querySelector('[data-admin]').dataset.active = state.step === 3;
  document.querySelector('[data-readout]').textContent = `${state.step + 1} / ${FLOW_STEPS.length}`;
  document.querySelector('[data-caption]').textContent = FLOW_STEPS[state.step][1];
  const transfer = [
    'Ticket enters the lab',
    'Graph query →',
    '← Assignment missing',
    'You change Entra',
    'Graph refresh →',
    '← Latest assignment',
  ][state.step];
  document.querySelector('[data-transfer]').textContent = matchMedia('(max-width: 600px)').matches
    ? transfer.replace('→', '↓').replace('←', '↑')
    : transfer;
  play.textContent = playing ? 'Pause' : elapsed >= total ? 'Play again' : 'Play the flow';
  buttons.forEach((button, index) => {
    button.setAttribute('aria-pressed', String(index === state.step));
  });
  if (previousStep !== state.step) {
    if (document.activeElement !== document.body || !touring) status.textContent = FLOW_STEPS[state.step].join('. ');
    previousStep = state.step;
  }
}
function pause() {
  playing = false;
  cancelAnimationFrame(frame);
  frame = 0;
  last = 0;
  render();
}
function tick(now) {
  if (!playing) return;
  elapsed = Math.min(total, elapsed + (last ? Math.min(33.34, now - last) : 0));
  last = now;
  render();
  if (elapsed >= total) {
    pause();
    if (touring) queueTour(3000);
  } else frame = requestAnimationFrame(tick);
}
function start() {
  clearTimeout(timer);
  if (reduced.matches) return;
  if (elapsed >= total) elapsed = 0;
  playing = true;
  last = 0;
  render();
  frame = requestAnimationFrame(tick);
}
function takeOver() {
  touring = false;
  clearTimeout(timer);
}
function queueTour(delay = 1400) {
  clearTimeout(timer);
  if (touring && visible && !document.hidden && !reduced.matches) timer = setTimeout(start, delay);
}
play.addEventListener('click', () => {
  takeOver();
  if (playing) pause();
  else start();
});
document.querySelector('[data-replay]').addEventListener('click', () => {
  takeOver();
  pause();
  elapsed = 0;
  render();
  start();
});
function select(index) {
  takeOver();
  pause();
  elapsed = index * STEP_TIME + STEP_TIME * 0.85;
  render();
}
buttons.forEach((button, index) => button.addEventListener('click', () => select(index)));
root.addEventListener('keydown', (event) => {
  if (event.target !== root) return;
  if (![' ', 'Enter', 'Home', 'End', 'ArrowLeft', 'ArrowRight'].includes(event.key)) return;
  event.preventDefault();
  const step = flowAt(elapsed).step;
  if (event.key === 'Home') select(0);
  else if (event.key === 'End') select(5);
  else if (event.key === 'ArrowLeft') select(Math.max(0, step - 1));
  else if (event.key === 'ArrowRight') select(Math.min(5, step + 1));
  else play.click();
});
root.addEventListener('pointerenter', () => {
  if (touring) {
    clearTimeout(timer);
    pause();
  }
});
root.addEventListener('pointerleave', () => queueTour(3600));
document.addEventListener('focusin', () => {
  takeOver();
  pause();
});
new IntersectionObserver((entries) => {
  visible = entries.at(-1).isIntersecting;
  if (!visible) {
    clearTimeout(timer);
    pause();
  } else queueTour();
}).observe(root);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    clearTimeout(timer);
    pause();
  } else queueTour();
});
function motion() {
  pause();
  play.hidden = reduced.matches;
  document.querySelector('[data-replay]').hidden = reduced.matches;
  if (reduced.matches) elapsed = total;
  render();
}
reduced.addEventListener('change', motion);
motion();
new ResizeObserver(() =>
  parent.postMessage({ type: 'anatomy-height', height: document.body.scrollHeight + 4 }, '*'),
).observe(document.body);
</script></body></html>
