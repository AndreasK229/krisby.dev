<svg width="780" height="540" viewBox="0 0 780 540" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Elytra and Ascendra architecture</title>
<desc>HR admins change employment data in Elytra, the HR system of record. Every change, and a daily job for future-dated hires and leavers, writes an event to Elytra's append-only outbox. Ascendra, the IGA platform, polls that outbox every minute over a shared-secret HTTP API to keep identities and their lifecycle up to date, and every six hours compares its identities against Elytra's employee records in a read-only check. The two systems share no database and Ascendra never writes back to HR. Ascendra creates, updates and disables real accounts and group memberships in Microsoft Entra ID through Microsoft Graph, and checks Entra for drift every fifteen minutes.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#475467" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<style>
text { font-family: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif; }
.h { font-size: 15px; font-weight: 600; }
.sub { font-size: 12px; }
.t { font-size: 13.5px; font-weight: 600; fill: #101828; }
.d { font-size: 11.5px; fill: #667085; }
.lbl { font-size: 12px; fill: #344054; font-weight: 500; }
.note { font-size: 11.5px; fill: #667085; }
.mono { font-family: "IBM Plex Mono", ui-monospace, Consolas, monospace; font-size: 11px; fill: #667085; }
.flow { stroke: #475467; stroke-width: 1.5; fill: none; }
.check { stroke: #475467; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.card { fill: #ffffff; stroke: #d0d5dd; stroke-width: 0.75; }
</style>

<rect x="0" y="0" width="780" height="540" fill="#faf9f6"/>

<!-- Operators -->
<rect x="105" y="14" width="120" height="28" rx="14" fill="#ffffff" stroke="#0d9488" stroke-width="0.75"/>
<text x="165" y="32" text-anchor="middle" class="lbl">HR admin</text>
<line x1="165" y1="42" x2="165" y2="68" class="flow" marker-end="url(#arrow)"/>

<rect x="525" y="14" width="140" height="28" rx="14" fill="#ffffff" stroke="#7c5cd6" stroke-width="0.75"/>
<text x="595" y="32" text-anchor="middle" class="lbl">IGA admin</text>
<line x1="595" y1="42" x2="595" y2="68" class="flow" marker-end="url(#arrow)"/>

<!-- Elytra -->
<rect x="30" y="70" width="270" height="310" rx="20" fill="#ecfdf5" stroke="#0d9488" stroke-width="0.75"/>
<text x="165" y="99" text-anchor="middle" class="h" fill="#0d9488">Elytra</text>
<text x="165" y="116" text-anchor="middle" class="sub" fill="#0f766e">HR system of record</text>

<rect x="50" y="135" width="230" height="58" rx="10" class="card"/>
<text x="165" y="159" text-anchor="middle" class="t">Employment records</text>
<text x="165" y="176" text-anchor="middle" class="d">Employees &amp; departments</text>

<line x1="165" y1="193" x2="165" y2="213" class="flow" marker-end="url(#arrow)"/>

<rect x="50" y="215" width="230" height="58" rx="10" class="card"/>
<text x="165" y="239" text-anchor="middle" class="t">Outbox events</text>
<text x="165" y="256" text-anchor="middle" class="d">Append-only joiner/mover/leaver feed</text>

<line x1="165" y1="297" x2="165" y2="277" class="flow" marker-end="url(#arrow)"/>

<rect x="50" y="297" width="230" height="58" rx="10" class="card"/>
<text x="165" y="321" text-anchor="middle" class="t">Daily lifecycle job</text>
<text x="165" y="338" text-anchor="middle" class="d">Future-dated starts &amp; leavers take effect</text>

<!-- Ascendra -->
<rect x="460" y="70" width="270" height="310" rx="20" fill="#f5f3ff" stroke="#7c5cd6" stroke-width="0.75"/>
<text x="595" y="99" text-anchor="middle" class="h" fill="#6a4bc4">Ascendra</text>
<text x="595" y="116" text-anchor="middle" class="sub" fill="#7c5cd6">Identity governance (IGA)</text>

<rect x="480" y="135" width="230" height="58" rx="10" class="card"/>
<text x="595" y="159" text-anchor="middle" class="t">HR reconciliation</text>
<text x="595" y="176" text-anchor="middle" class="d">Flags differences, never writes back</text>

<rect x="480" y="215" width="230" height="58" rx="10" class="card"/>
<text x="595" y="239" text-anchor="middle" class="t">Identities &amp; lifecycle</text>
<text x="595" y="256" text-anchor="middle" class="d">Provisioning, offboarding SLAs, audit</text>

<rect x="480" y="297" width="230" height="58" rx="10" class="card"/>
<text x="595" y="321" text-anchor="middle" class="t">Access governance</text>
<text x="595" y="338" text-anchor="middle" class="d">Roles, maker/checker, recertification</text>

<!-- Elytra to Ascendra -->
<text x="380" y="155" text-anchor="middle" class="lbl">compare, every 6 h</text>
<line x1="282" y1="164" x2="478" y2="164" class="check" marker-end="url(#arrow)"/>
<text x="380" y="182" text-anchor="middle" class="mono">GET /api/employees</text>

<text x="380" y="235" text-anchor="middle" class="lbl">poll, every 1 min</text>
<line x1="282" y1="244" x2="478" y2="244" class="flow" marker-end="url(#arrow)"/>
<text x="380" y="262" text-anchor="middle" class="mono">GET /api/events</text>

<text x="380" y="310" text-anchor="middle" class="note">Shared-secret HTTP API only.</text>
<text x="380" y="326" text-anchor="middle" class="note">No shared database.</text>
<text x="380" y="342" text-anchor="middle" class="note">Ascendra never writes to HR.</text>

<!-- Ascendra to Entra -->
<line x1="545" y1="380" x2="545" y2="448" class="flow" marker-end="url(#arrow)"/>
<text x="535" y="410" text-anchor="end" class="lbl">create, update, disable</text>
<text x="535" y="426" text-anchor="end" class="lbl">group membership</text>

<line x1="660" y1="448" x2="660" y2="382" class="check" marker-end="url(#arrow)"/>
<text x="672" y="410" text-anchor="start" class="lbl">drift check</text>
<text x="672" y="426" text-anchor="start" class="lbl">every 15 min</text>

<rect x="480" y="450" width="230" height="58" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="0.75"/>
<text x="595" y="474" text-anchor="middle" class="t">Microsoft Entra ID</text>
<text x="595" y="491" text-anchor="middle" class="d">Real tenant, via Microsoft Graph</text>

<!-- Legend -->
<line x1="40" y1="460" x2="80" y2="460" class="flow" marker-end="url(#arrow)"/>
<text x="90" y="464" text-anchor="start" class="note">Makes a change</text>
<line x1="40" y1="486" x2="80" y2="486" class="check" marker-end="url(#arrow)"/>
<text x="90" y="490" text-anchor="start" class="note">Checks only (read-only)</text>
</svg>
